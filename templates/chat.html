<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>免费 AI 模型聊天</title>
<style>
:root{
  --bg:#fbfbf9; --card:#fff; --line:#e7e5de; --line2:#d5d2c8;
  --tx:#22211e; --tx2:#6b6960; --tx3:#96938a;
  --acc:#185fa5; --acc-bg:#e6f1fb; --ok:#0f6e56; --ok-bg:#e1f5ee;
  --warn:#854f0b; --warn-bg:#faeeda; --danger:#a32d2d; --danger-bg:#fcebeb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.app{max-width:900px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:18px 16px 16px}
h1{font-size:18px;font-weight:600;margin:0 0 3px}
.sub{font-size:12.5px;color:var(--tx2);margin:0 0 14px}
.cfg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;flex-wrap:wrap;gap:9px 12px;align-items:center;margin-bottom:12px}
.cfg label{font-size:12px;color:var(--tx2);flex:0 0 auto}
.cfg input,.cfg select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line2);
  border-radius:8px;background:var(--card);color:var(--tx);outline:none}
.cfg input{flex:1;min-width:170px}
.cfg select{flex:1;min-width:230px}
.cfg input:focus,.cfg select:focus{border-color:var(--acc)}
#keystat{font-size:12px;color:var(--ok)}
.chat{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.hint{color:var(--tx3);font-size:13px;text-align:center;margin:auto;line-height:1.9;max-width:460px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.a{align-self:flex-start}
.who{font-size:11.5px;color:var(--tx3);margin-bottom:4px}
.bub{padding:10px 13px;border-radius:11px;white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:14px}
.msg.u .bub{background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.a .bub{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.think{margin-top:6px;font-size:12.5px;color:var(--tx2);background:var(--warn-bg);
  border-radius:8px;padding:7px 10px;white-space:pre-wrap;line-height:1.6}
.think summary{cursor:pointer;color:var(--warn);font-weight:500;font-size:12px}
.err{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.7}
.input{display:flex;gap:9px;margin-top:12px;align-items:flex-end}
textarea{flex:1;font:inherit;font-size:14px;padding:10px 13px;border:1px solid var(--line2);
  border-radius:11px;background:var(--card);color:var(--tx);resize:none;height:56px;
  outline:none;line-height:1.6;font-family:inherit}
textarea:focus{border-color:var(--acc)}
button{font:inherit;font-size:13.5px;padding:10px 20px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line2);background:var(--card);color:var(--tx)}
button:hover{border-color:var(--tx3)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{opacity:.9}
button:disabled{opacity:.45;cursor:not-allowed}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);
  margin-right:5px;vertical-align:middle}
@media(prefers-color-scheme:dark){
  :root{--bg:#191918;--card:#232322;--line:#32322f;--line2:#46453f;--tx:#f1efe8;--tx2:#a8a59b;
    --tx3:#7d7a72;--acc:#85b7eb;--acc-bg:#0c447c;--ok:#5dcaa5;--ok-bg:#085041;
    --warn:#ef9f27;--warn-bg:#412402;--danger:#f09595;--danger-bg:#501313}
  input,select,textarea,button{background:#232322;color:var(--tx)}
  .msg.a .bub{background:#1f1f1e}
}
</style>
</head>
<body>
<div class="app">
  <h1>免费 AI 模型聊天</h1>
  <p class="sub">直接用你的密钥和免费模型对话 —— 不需要写代码、不需要装东西。密钥只保存在你自己电脑的浏览器里，不会发给任何第三方。</p>

  <div class="cfg">
    <label>密钥</label>
    <input type="password" id="key" placeholder="粘贴 OpenRouter Key（sk-or-v1- 开头）" autocomplete="off">
    <span id="keystat"></span>
  </div>
  <div class="cfg">
    <label>模型</label>
    <select id="model"></select>
  </div>

  <div class="chat" id="chat">
    <div class="hint">先填上面的密钥，再用下面这个输入框提问。<br>回车发送，Shift+回车换行。</div>
  </div>

  <div class="input">
    <textarea id="q" placeholder="问点什么…（回车发送）"></textarea>
    <button class="pri" id="send">发送</button>
  </div>
</div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const BASE = "https://openrouter.ai/api/v1";
const LS_KEY = "far.apikey", LS_MODEL = "far.model";

/* 只放 OpenRouter 的免费模型（CORS 允许浏览器直连），并标出可调用性 */
const MODELS = D.models.filter(m => m.platform === "openrouter")
  .map(m => ({id:m.id, name:m.name, ctx:m.context, caps:m.caps,
              callable:m.callable||"unprobed", why:m.callable_note||""}))
  .sort((a,b)=> (a.callable==="callable"?0:1)-(b.callable==="callable"?0:1)
                || (b.ctx||0)-(a.ctx||0));

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return this._m&&this._m[k]; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ (this._m=this._m||{})[k]=v; } }
};

/* ── 填充模型下拉框 ── */
const sel = document.getElementById('model');
const MARK = {callable:"✅", congested:"⏳", agentic_only:"🔒", not_chat:"🎵", unprobed:"—"};
sel.innerHTML = MODELS.map(m=>{
  const bad = ["agentic_only","not_chat"].includes(m.callable);
  const tag = (m.caps.tools?"🛠":"") + (m.caps.vision?"🖼":"") + (m.caps.reasoning?"🧠":"");
  const label = `${MARK[m.callable]} ${m.name}　${fmtCtx(m.ctx)} ${tag}`
    + (bad ? "（不可直接调用）" : "");
  return `<option value="${esc(m.id)}" ${bad?'disabled':''}>${esc(label)}</option>`;
}).join("");
sel.value = store.get(LS_MODEL) || (MODELS.find(m=>m.callable==="callable")||{}).id || "";
sel.onchange = ()=> store.set(LS_MODEL, sel.value);

function fmtCtx(n){ if(!n) return "";
  return n>=1000000 ? (n/1000000).toFixed(1).replace(/\.0$/,"")+"M" : Math.round(n/1000)+"K"; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ── 密钥 ── */
const keyEl = document.getElementById('key'), keyStat = document.getElementById('keystat');
keyEl.value = store.get(LS_KEY) || "";
function refreshKeyStat(){
  keyStat.innerHTML = keyEl.value.trim()
    ? '<span class="dot"></span>已保存到本机浏览器'
    : '';
}
keyEl.oninput = ()=>{ store.set(LS_KEY, keyEl.value.trim()); refreshKeyStat(); };
refreshKeyStat();

/* ── 聊天 ── */
const chat = document.getElementById('chat'), q = document.getElementById('q');
const sendBtn = document.getElementById('send');
let running = false;

function addMsg(role, text){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role==='user'?'u':'a');
  wrap.innerHTML = `<div class="who">${role==='user'?'你':'模型'}</div><div class="bub"></div>`;
  wrap.querySelector('.bub').textContent = text;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}
function addError(html){
  const d = document.createElement('div');
  d.className = 'msg a';
  d.innerHTML = `<div class="err">${html}</div>`;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

function explain(status, body){
  const t = [];
  if(status===429) t.push("💡 <b>429 限流</b>：要么是上游供应方拥堵（换个模型试），要么是免费档每日额度用完（等次日重置）。");
  else if(status===403 && /agentic harnesses/.test(body)) t.push("💡 该模型<b>仅限 Agent 客户端</b>使用，普通 API 调不通，请换一个。");
  else if(status===401) t.push("💡 <b>401</b>：密钥无效或已删除，去 OpenRouter 后台重新生成。");
  else if(status===403) t.push("💡 <b>403</b>：密钥无效或无权限，检查是否复制完整。");
  t.push(`<br><br>原始返回：<code>${esc(body.slice(0,300))}</code>`);
  return t.join("");
}

async function send(){
  if(running) return;
  const text = q.value.trim();
  const apiKey = keyEl.value.trim();
  if(!text) return;
  if(!apiKey){ addError("请先填写 OpenRouter 密钥（上面「密钥」那一栏）。"); return; }
  if(!sel.value){ addError("请先选择一个模型。"); return; }

  running = true; sendBtn.disabled = true;
  q.value = "";
  const hint = chat.querySelector('.hint'); if(hint) hint.remove();
  addMsg('user', text);
  const node = addMsg('assistant', '');
  const bub = node.querySelector('.bub');
  bub.textContent = '…';

  try{
    const resp = await fetch(`${BASE}/chat/completions`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
      body: JSON.stringify({
        model: sel.value,
        messages: [{role:'user', content:text}],
        max_tokens: 2000,
        stream: true,
      }),
    });

    if(!resp.ok){
      const body = await resp.text();
      bub.textContent = '';
      node.remove();
      addError(`调用失败 HTTP ${resp.status}${explain(resp.status, body)}`);
      return;
    }

    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '', out = '', think = '', started = false;

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith('data:')) continue;
        const p = s.slice(5).trim();
        if(p === '[DONE]') continue;
        let j; try{ j = JSON.parse(p); }catch(e){ continue; }
        const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
        if(d.reasoning){
          think += d.reasoning;
          if(!node.querySelector('.think')){
            const t = document.createElement('details');
            t.className='think';
            t.innerHTML = '<summary>🧠 思考过程</summary><div class="tt"></div>';
            node.appendChild(t);
          }
          node.querySelector('.think .tt').textContent = think;
        }
        if(d.content){
          out += d.content;
          if(!started){ bub.textContent=''; started = true; }
          bub.textContent = out;
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
    if(!out) bub.textContent = think ? '（模型把内容都放在思考过程里了，展开上方查看）' : '（模型没有返回内容）';
    chat.scrollTop = chat.scrollHeight;
  }catch(e){
    node.remove();
    addError(`网络异常：${esc(String(e))}<br><br>💡 如果提示 CORS 或 Failed to fetch，可能是网络到 OpenRouter 不通，检查代理。`);
  }finally{
    running = false; sendBtn.disabled = false; q.focus();
  }
}

sendBtn.onclick = send;
q.onkeydown = e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
};
q.focus();
</script>
</body>
</html>
